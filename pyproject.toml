[project]
name = "ltdb"
version = "0.1.0"
description = "Linguistic Type Database — Flask web app for DELPH-IN grammars"
requires-python = ">=3.12"
dependencies = [
    "pydelphin",
    "markdown-it-py",
    "lxml",
    "Flask",
    "Frozen-Flask",
    "Werkzeug",
    "Jinja2",
    "MarkupSafe",
    "itsdangerous",
    "click",
    "toml",
    "gunicorn",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["web"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-playwright>=0.7.2",
    "requests>=2.32",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
